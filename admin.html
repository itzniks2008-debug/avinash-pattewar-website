<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login | Avinash Pattewar Sir</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#102747;color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;color:#172c49;padding:32px;border-radius:18px;box-shadow:0 20px 60px #0003}
.logo{font-size:12px;letter-spacing:2px;color:#9a651a;font-weight:bold}
h1{margin:12px 0 8px;font-size:28px}
p{color:#637187;line-height:1.5}
label{display:block;font-weight:bold;margin:18px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccd5e1;border-radius:8px;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#f2a12b;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:16px;font-size:14px;overflow-wrap:anywhere}
.back{display:block;text-align:center;margin-top:22px;color:#52647b}
</style>
</head>
<body>
<main class="card">
  <div class="logo">AVINASH PATTEWAR SIR</div>
  <h1>Admin Login</h1>
  <p>Sign in to manage MPSC and UPSC study materials.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="loginButton" type="submit">Sign in securely</button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>
  <a class="back" href="./index.html">← Back to website</a>
</main>

<script type="module">
import { createClient } from
  "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://dcwsyhywjyujwcbptxab.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_zCz1LrWDghA85X9oQbkDVg_mCzc2033";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async event => {
  event.preventDefault();
  button.disabled = true;
  message.textContent = "Signing in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    // Confirm the signed-in user is authorized by the database.
    const { data: isAdmin, error: adminError } =
      await supabase.rpc("is_site_admin");

    if (adminError || isAdmin !== true) {
      await supabase.auth.signOut();
      throw new Error("This account is not authorized to administer the website.");
    }

    message.textContent =
      "Login successful! The upload dashboard will be added next.";
  } catch (error) {
    message.textContent = error.message ||
      "Unable to sign in. Please check your details.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
