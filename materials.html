<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="MPSC and UPSC question papers and practice materials from Avinash Pattewar Sir.">
<title>Study Materials | Avinash Pattewar Sir</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#142b49;font-family:Arial,sans-serif}
header{background:#102747;color:white;padding:36px 20px}
.wrap{width:min(1050px,92%);margin:auto}
h1{margin:0;font-size:clamp(28px,5vw,42px)}
header p{color:#dce5f1;line-height:1.6}
.hero-label{color:#f2a12b;font-size:12px;font-weight:bold;letter-spacing:2px}
main{padding:30px 0 60px}
.filters{display:grid;grid-template-columns:1fr 220px;gap:12px;margin-bottom:22px}
input,select{width:100%;padding:13px;border:1px solid #d4dce8;border-radius:9px;background:white;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:22px;box-shadow:0 8px 25px #142b4908}
.tag{display:inline-block;padding:6px 9px;background:#fff1d8;color:#86550b;border-radius:6px;font-size:12px;font-weight:bold}
h2{font-size:20px;line-height:1.4;margin:14px 0 8px;overflow-wrap:anywhere}
.desc{color:#64748b;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
button,.download{display:inline-block;border:0;border-radius:8px;padding:12px 15px;background:#f2a12b;color:#142b49;font-weight:bold;text-decoration:none;cursor:pointer}
.status{padding:20px;background:white;border-radius:12px;color:#64748b;line-height:1.6}
footer{background:#102747;color:#dce5f1;text-align:center;padding:25px 15px;line-height:1.7}
footer strong{color:white}
@media(max-width:600px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hero-label">MPSC • UPSC • CIVIL SERVICES</div>
    <h1>Study Materials</h1>
    <p>Practice question papers and learning resources from<br>
       <strong>Avinash Pattewar Sir</strong></p>
  </div>
</header>

<main class="wrap">
  <div class="filters">
    <input id="search" type="search" placeholder="Search question papers…">
    <select id="category">
      <option value="">All categories</option>
      <option>MPSC Rajyaseva</option>
      <option>MPSC Group B</option>
      <option>MPSC Group C</option>
      <option>UPSC</option>
      <option>Current Affairs</option>
      <option>Practice Papers</option>
    </select>
  </div>

  <div id="status" class="status" role="status" aria-live="polite">
    Loading published study materials…
  </div>
  <section id="materials" class="grid" aria-label="Published study materials"></section>
</main>

<footer>
  <strong>Avinash Pattewar Sir | MPSC & UPSC Guidance</strong><br>
  Learn consistently. Practise strategically. Prepare confidently.
</footer>

<script type="module">
import { createClient } from
  "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://dcwsyhywjyujwcbptxab.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_zCz1LrWDghA85X9oQbkDVg_mCzc2033";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const materialsEl = document.getElementById("materials");
const statusEl = document.getElementById("status");

let allMaterials = [];

function renderMaterials() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const category = document.getElementById("category").value;

  const filtered = allMaterials.filter(item =>
    (!category || item.category === category) &&
    `${item.title} ${item.description} ${item.category}`
      .toLowerCase().includes(query)
  );

  materialsEl.replaceChildren();

  if (!filtered.length) {
    statusEl.textContent = allMaterials.length
      ? "No papers match your search."
      : "No published materials are available yet.";
    statusEl.hidden = false;
    return;
  }

  statusEl.hidden = true;

  for (const item of filtered) {
    const card = document.createElement("article");
    card.className = "card";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = item.category;

    const title = document.createElement("h2");
    title.textContent = item.title;

    const desc = document.createElement("p");
    desc.className = "desc";
    // Avoid displaying the marketing footer twice in the description.
    desc.textContent = item.description || "Question paper and study material.";

    const download = document.createElement("button");
    download.className = "download";
    download.textContent = "Download PDF";
    download.addEventListener("click", () => downloadPdf(item));

    card.append(tag, title, desc, download);
    materialsEl.append(card);
  }
}

async function downloadPdf(item) {
  const buttons = materialsEl.querySelectorAll("button");
  buttons.forEach(button => button.disabled = true);

  try {
    const { data, error } = await supabase.storage
      .from("study-materials")
      .createSignedUrl(item.storage_path, 120);

    if (error) throw error;

    // The signed URL is temporary and expires after 120 seconds.
    const link = document.createElement("a");
    link.href = data.signedUrl;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.download = "";
    document.body.append(link);
    link.click();
    link.remove();
  } catch (error) {
    alert("Unable to download this paper right now. Please try again later.");
    console.error("PDF download failed:", error);
  } finally {
    buttons.forEach(button => button.disabled = false);
  }
}

async function loadMaterials() {
  statusEl.hidden = false;
  statusEl.textContent = "Loading published study materials…";

  const { data, error } = await supabase
    .from("study_materials")
    .select("id,title,description,category,storage_path,created_at")
    .eq("published", true)
    .order("created_at", { ascending: false });

  if (error) {
    statusEl.textContent =
      "Study materials couldn't be loaded. Please try again later.";
    console.error("Materials query failed:", error);
    return;
  }

  allMaterials = data || [];
  renderMaterials();
}

document.getElementById("search").addEventListener("input", renderMaterials);
document.getElementById("category").addEventListener("change", renderMaterials);

loadMaterials();
</script>
</body>
</html>
